# PostgreSQL for the integration tests: `docker compose up -d`, then `composer test`.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: acta
      POSTGRES_PASSWORD: acta
      POSTGRES_DB: acta_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acta -d acta_test"]
      interval: 2s
      timeout: 2s
      retries: 20
