# Only for working on the skeleton inside the Acta monorepo, where the four libraries
# are installed from ../ as symbolic links: the whole repository is mounted so that the
# links resolve.
#
#     docker compose -f compose.yaml -f compose.monorepo.yaml up
#
# A project created from the skeleton does not need this file: delete it.

x-monorepo: &monorepo
  working_dir: /acta/packages/skeleton
  volumes:
    - ../..:/acta

services:
  api: *monorepo
  migrate: *monorepo
  projector-accounts: *monorepo
  projector-webhooks: *monorepo
  webhook-sender: *monorepo
  web:
    volumes:
      - ./docker/nginx/monorepo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/acta/packages/skeleton/public:ro
