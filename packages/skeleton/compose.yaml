# The development environment, reached the way a deployment is: over HTTPS, with Keycloak
# as the identity provider. `make up` starts it; docs/local-stack.md describes it.
#
#     https://api.<APP_DOMAIN>     the API
#     https://auth.<APP_DOMAIN>    Keycloak (realm <COMPOSE_PROJECT_NAME>)
#
# The names come from .env: COMPOSE_PROJECT_NAME, APP_NAME and APP_DOMAIN.
#
# nginx terminates TLS for both names with a certificate made by mkcert (`make certs`).
# Inside the Compose network the two names resolve to nginx as well, so that the API
# reaches Keycloak at the very address tokens name as their issuer.
#
# It is one image run several ways, which is also how the application is deployed.

x-app: &app
  build:
    context: .
    target: dev
  # Trusts the mkcert authority before running the command.
  entrypoint: ["/app/docker/php/entrypoint.sh"]
  env_file: .env
  volumes:
    - .:/app
    - ./docker/certs/rootCA.pem:/usr/local/share/ca-certificates/mkcert.crt:ro
  tmpfs:
    # The compiled contract stays out of the working copy.
    - /app/data/cache:mode=1777
  depends_on:
    migrate:
      condition: service_completed_successfully
    cache:
      condition: service_healthy

services:
  # --- The entry point -----------------------------------------------------------------
  web:
    image: nginx:1-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The image fills in ${APP_DOMAIN} and writes the result to /etc/nginx/conf.d.
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - ./public:/app/public:ro
    networks:
      default:
        aliases:
          - api.${APP_DOMAIN}
          - auth.${APP_DOMAIN}
    depends_on:
      - api
      - keycloak
    restart: unless-stopped

  # --- The application -----------------------------------------------------------------
  api:
    <<: *app
    command: php-fpm
    restart: unless-stopped

  # Creates the tables that do not exist yet, then exits.
  migrate:
    <<: *app
    command: bin/console es:migrate
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  # Read models and the webhook outbox follow the event log: one process per projection.
  projector-accounts:
    <<: *app
    command: bin/console projection:run banking_accounts
    restart: unless-stopped

  projector-webhooks:
    <<: *app
    command: bin/console projection:run webhooks
    restart: unless-stopped

  # Sends the queued webhooks to their subscribers, with retries.
  webhook-sender:
    <<: *app
    command: bin/console webhook:deliver --watch
    restart: unless-stopped

  # --- What it depends on --------------------------------------------------------------
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "${DATABASE_PORT:-54320}:5432"
    volumes:
      - database:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Valkey: the metadata and the keys of the identity provider, shared by every process
  # of the application (CACHE_DSN). Nothing in it needs to survive a restart.
  cache:
    image: valkey/valkey:9-alpine
    command: valkey-server --save "" --appendonly no
    ports:
      - "${CACHE_PORT:-63790}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  # The identity provider. The realm in docker/keycloak is imported on the first start,
  # with the names of .env; later changes made in the admin console live in the database.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # The public address: what tokens carry as "iss", whoever asks and from wherever.
      KC_HOSTNAME: https://auth.${APP_DOMAIN}
      # nginx terminates TLS and says so in the X-Forwarded-* headers.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # What the placeholders of docker/keycloak/realm.json stand for.
      APP_REALM: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in .env}
      APP_NAME: ${APP_NAME:-Application}
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # The image has no curl: speak HTTP to the management port with bash alone.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

volumes:
  database:
