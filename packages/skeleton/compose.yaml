# The development environment: the API behind nginx, its workers, PostgreSQL and an
# identity provider. `make up` starts it; see the Makefile for the rest.
#
# It is one image run several ways, which is also how the application is deployed.

x-app: &app
  build:
    context: .
    target: dev
  env_file: .env
  volumes:
    - .:/app
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  # --- The application ---------------------------------------------------------------
  web:
    image: nginx:1-alpine
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    depends_on:
      - api

  api:
    <<: *app

  # Creates the tables that do not exist yet, then exits.
  migrate:
    <<: *app
    command: bin/console es:migrate
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  # Read models and the webhook outbox follow the event log: one process per projection.
  projector-accounts:
    <<: *app
    command: bin/console projection:run banking_accounts
    restart: unless-stopped

  projector-webhooks:
    <<: *app
    command: bin/console projection:run webhooks
    restart: unless-stopped

  # Sends the queued webhooks to their subscribers, with retries.
  webhook-sender:
    <<: *app
    command: bin/console webhook:deliver --watch
    restart: unless-stopped

  # --- What it depends on ------------------------------------------------------------
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 2s
      timeout: 2s
      retries: 20

  # A stand-in for the identity provider, for development only: it signs a token for
  # whoever asks. Every token carries the audience and the scopes below. `make token`
  # prints one.
  idp:
    image: ${IDP_IMAGE:-ghcr.io/navikt/mock-oauth2-server:2.1.10}
    environment:
      JSON_CONFIG: >-
        {
          "interactiveLogin": false,
          "tokenCallbacks": [{
            "issuerId": "default",
            "tokenExpiry": 3600,
            "requestMappings": [{
              "requestParam": "grant_type",
              "match": "*",
              "claims": {"sub": "developer", "aud": ["acta-api"], "scope": "banking:read banking:write"}
            }]
          }]
        }
    ports:
      - "${IDP_PORT:-8081}:8080"

volumes:
  database:
