; Production settings on top of php.ini-production.
expose_php = Off
memory_limit = 256M

; The code of an image never changes: compile it once.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; Errors go to the log stream of the container, never to clients.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
